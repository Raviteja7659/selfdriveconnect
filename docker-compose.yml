services:
  postgres:
    image: postgres:16
    container_name: sdc-postgres
    restart: always
    environment:
      POSTGRES_USER: sdc_user
      POSTGRES_PASSWORD: sdc_pass
      POSTGRES_DB: sdc_vehicle_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - sdc-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: sdc-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sdc.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - sdc-network

  redis:
    image: redis:7-alpine
    container_name: sdc-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - sdc-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sdc-rabbitmq
    restart: always
    ports:
      - "5672:5672" # AMQP protocol port — services connect here
      - "15672:15672" # Management UI — http://localhost:15672 (guest/guest)
    networks:
      - sdc-network

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: sdc-user-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sdc_user_db
      - SPRING_DATASOURCE_USERNAME=sdc_user
      - SPRING_DATASOURCE_PASSWORD=sdc_pass
    depends_on:
      - postgres
    networks:
      - sdc-network

  vehicle-service:
    build:
      context: ./vehicle-service
      dockerfile: Dockerfile
    container_name: sdc-vehicle-service
    restart: always
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sdc_vehicle_db
      - SPRING_DATASOURCE_USERNAME=sdc_user
      - SPRING_DATASOURCE_PASSWORD=sdc_pass
    depends_on:
      - postgres
    networks:
      - sdc-network

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: sdc-booking-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sdc_booking_db
      - SPRING_DATASOURCE_USERNAME=sdc_user
      - SPRING_DATASOURCE_PASSWORD=sdc_pass
      - VEHICLE_SERVICE_URL=http://vehicle-service:8086
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - postgres
      - vehicle-service
      - rabbitmq
    networks:
      - sdc-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: sdc-payment-service
    restart: always
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sdc_payment_db
      - SPRING_DATASOURCE_USERNAME=sdc_user
      - SPRING_DATASOURCE_PASSWORD=sdc_pass
      - BOOKING_SERVICE_URL=http://booking-service:8083
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - postgres
      - booking-service
      - rabbitmq
    networks:
      - sdc-network

  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    container_name: sdc-review-service
    restart: always
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sdc_review_db
      - SPRING_DATASOURCE_USERNAME=sdc_user
      - SPRING_DATASOURCE_PASSWORD=sdc_pass
      - BOOKING_SERVICE_URL=http://booking-service:8083
    depends_on:
      - postgres
      - booking-service
    networks:
      - sdc-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: sdc-api-gateway
    restart: always
    ports:
      - "8087:8087"
    environment:
      - SERVICES_USER_SERVICE=http://user-service:8082
      - SERVICES_VEHICLE_SERVICE=http://vehicle-service:8086
      - SERVICES_BOOKING_SERVICE=http://booking-service:8083
      - SERVICES_PAYMENT_SERVICE=http://payment-service:8084
      - SERVICES_REVIEW_SERVICE=http://review-service:8085
    depends_on:
      - user-service
      - vehicle-service
      - booking-service
      - payment-service
      - review-service
    networks:
      - sdc-network

volumes:
  pgdata:

networks:
  sdc-network:
    driver: bridge
