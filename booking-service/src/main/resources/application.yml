server:
  port: 8083

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5433/sdc_booking_db
    username: sdc_user
    password: sdc_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Must match user-service's jwt.secret exactly — this service only
# VALIDATES tokens issued by user-service, it never issues its own.
jwt:
  secret: "sdc-local-dev-secret-key-change-me-before-any-real-deployment-32chars+"

# URL of vehicle-service — hardcoded for local dev.
# Once Eureka/K8s service discovery is added, this becomes
# vehicle-service (resolved by name) instead of localhost:8086.
vehicle-service:
  url: http://localhost:8086

# Shared secret for internal service-to-service calls (e.g.
# payment-service confirming a booking after a successful payment).
# Must match payment-service's internal.service-key exactly.
# IMPORTANT: local-dev placeholder only — override via env var
# (INTERNAL_SERVICE_KEY) in any real deployment.
internal:
  service-key: "${INTERNAL_SERVICE_KEY:sdc-local-internal-service-key-change-me}"

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000
        loggerLevel: basic

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.selfdriveconnect: DEBUG
    com.selfdriveconnect.bookingservice.client: DEBUG
