server:
  port: 8083

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5433/sdc_booking_db
    username: sdc_user
    password: sdc_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  # RabbitMQ — the event backbone. Payment outcomes arrive here
  # (from payment-service) instead of via a direct HTTP call; see
  # PaymentEventListener. Defaults match docker-compose's local
  # RabbitMQ container credentials (guest/guest) — fine for local dev
  # only. In docker-compose, SPRING_RABBITMQ_HOST=rabbitmq overrides
  # the "localhost" default so containers find each other by service
  # name instead of trying to reach RabbitMQ inside their own container.
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

# Must match user-service's jwt.secret exactly — this service only
# VALIDATES tokens issued by user-service, it never issues its own.
jwt:
  secret: "sdc-local-dev-secret-key-change-me-before-any-real-deployment-32chars+"

# URL of vehicle-service — hardcoded for local dev.
# Once Eureka/K8s service discovery is added, this becomes
# vehicle-service (resolved by name) instead of localhost:8086.
vehicle-service:
  url: http://localhost:8086

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000
        loggerLevel: basic

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.selfdriveconnect: DEBUG
    com.selfdriveconnect.bookingservice.client: DEBUG
