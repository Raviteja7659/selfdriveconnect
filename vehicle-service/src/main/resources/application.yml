server:
  port: 8086

spring:
  application:
    name: vehicle-service
  datasource:
    url: jdbc:postgresql://localhost:5433/sdc_vehicle_db
    username: sdc_user
    password: sdc_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Must match user-service's jwt.secret exactly — this service only
# VALIDATES tokens issued by user-service, it never issues its own.
jwt:
  secret: "sdc-local-dev-secret-key-change-me-before-any-real-deployment-32chars+"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.selfdriveconnect: DEBUG
