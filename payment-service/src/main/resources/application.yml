server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5433/sdc_payment_db
    username: sdc_user
    password: sdc_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Must match user-service's jwt.secret exactly — this service only
# VALIDATES tokens issued by user-service, it never issues its own.
jwt:
  secret: "sdc-local-dev-secret-key-change-me-before-any-real-deployment-32chars+"

# URL of booking-service — hardcoded for local dev.
booking-service:
  url: http://localhost:8083

# Shared secret for the service-to-service call that confirms a
# booking after a successful payment. Must match the same value
# configured in booking-service's application.yml.
# IMPORTANT: local-dev placeholder only — override via env var
# (INTERNAL_SERVICE_KEY) in any real deployment.
internal:
  service-key: "${INTERNAL_SERVICE_KEY:sdc-local-internal-service-key-change-me}"

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000
        loggerLevel: basic

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.selfdriveconnect: DEBUG
